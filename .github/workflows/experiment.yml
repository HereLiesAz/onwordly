name: Experiment 001

on:
  push:
    branches: [main]
    paths:
      - '.experiment-run'
  workflow_dispatch:

permissions: read-all

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[train,test]"
      - run: pytest -q
      - run: onwordly-arithmetic
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onwordly-experiment-001
          path: results/001-arithmetic-curriculum/
          if-no-files-found: warn
