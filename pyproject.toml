[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "onwordly"
version = "0.1.0"
description = "Experiments in data-efficient training for small language models"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]
train = [
  "torch>=2.2",
  "transformers>=4.45,<6"
]

[project.scripts]
onwordly-arithmetic = "onwordly.experiments.arithmetic:main"
onwordly-arithmetic-suite = "onwordly.experiments.suite:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
