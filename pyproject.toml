[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "onwordly"
version = "0.1.0"
description = "A small learner with earned trust, conscious judgment and add-only memory"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8"]
train = [
  "torch>=2.2"
]

[project.scripts]
onwordly-kaggle = "onwordly.learner.kaggle:main"
onwordly-learner = "onwordly.learner.experiment:main"
onwordly-learner-kaggle = "onwordly.learner.kaggle:main"
onwordly-publish = "onwordly.publish:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
